<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00793c">
<title>Nächste Abfahrt</title>
<style>
:root{--bg:#eef2f4;--ink:#14212b;--mute:#5d6b76;--card:#fff;--line:#d5dde2;--green:#00793c;--yellow:#ffd500;--late:#b3261e;--ok:#0a6b36;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f171d;--ink:#eaf0f3;--mute:#93a3ae;--card:#18232b;--line:#2b3a45;--late:#ff8a80;--ok:#6fd49a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header h1{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.01em}
.status{color:var(--mute);font-size:.9rem;min-height:1.3em}
.bar{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
button[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow);color:#14212b;font-weight:600}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.head{display:flex;align-items:center;gap:10px}
.sign{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--yellow);font-weight:800;display:grid;place-items:center}
.head h2{margin:0;font-size:1.05rem;flex:1;min-width:0;overflow-wrap:anywhere}
.x{min-height:36px;padding:2px 10px;color:var(--mute)}
.main{display:flex;align-items:baseline;gap:12px;margin:12px 0 2px}
.big{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.big small{font-size:1rem;font-weight:600;letter-spacing:0;margin-left:4px}
.line{display:inline-block;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px;font-weight:700;margin-right:6px}
.meta{color:var(--mute);font-size:.92rem}
.late{color:var(--late);font-weight:600}.ok{color:var(--ok);font-weight:600}
.more{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.row{display:flex;gap:10px;padding:5px 0;font-size:.95rem;align-items:baseline}
.row b{min-width:3.2rem}
.err{color:var(--late)}
.add{margin-top:20px}
.add h3{font-size:1rem;margin:0 0 8px}
.pick{display:flex;gap:8px}
input{font:inherit;flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;min-height:44px}
.res{list-style:none;margin:8px 0 0;padding:0}
.res button{width:100%;text-align:left;margin-bottom:6px}
footer{color:var(--mute);font-size:.82rem;margin-top:24px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Nächste Abfahrt</h1>
  <div class="status" id="status" role="status">Standort wird bestimmt …</div>
</header>
<div class="bar">
  <button class="primary" id="refresh">Aktualisieren</button>
  <button id="bus" aria-pressed="true">Nur Bus</button>
</div>
<div id="origin-fallback" hidden class="card">
  <h3 style="margin:0 0 8px">Startpunkt wählen</h3>
  <div id="origin-picker"></div>
</div>
<main id="list"></main>
<section class="add">
  <h3>Ziel hinzufügen</h3>
  <div id="dest-picker"></div>
</section>
<footer>Fahrplandaten und Echtzeit: <a href="https://transitous.org/sources" target="_blank" rel="noopener">Transitous</a> und die dort genannten Quellen, Karten: © OpenStreetMap-Mitwirkende. Abfragen laufen nur beim Öffnen und beim Tippen auf „Aktualisieren“.</footer>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const LS = "naechste-abfahrt-v1";
const BIAS = "50.5841,8.6784"; // Gießen, nur zum Auflösen der Standard-Haltestellen

let state;
try { state = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
if (!state || !Array.isArray(state.dests)) state = {
  busOnly: true,
  dests: [
    { label: "Klinikstraße", q: "Klinikstraße Gießen" },
    { label: "Waldstadion", q: "Waldstadion Gießen" },
    { label: "Marktplatz", q: "Marktplatz Gießen" }
  ]
};
const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} };

let origin = null, lastRun = 0;

// ---------- API (Transitous / MOTIS 2) ----------
async function call(path, params, versioned) {
  const qs = new URLSearchParams(params);
  const versions = versioned ? ["v6", "v5"] : ["v1"];
  let err = new Error("Keine Verbindung zum Server");
  for (const v of versions) {
    try {
      const r = await fetch(`https://api.transitous.org/api/${v}/${path}?${qs}`);
      if (r.ok) return await r.json();
      err = new Error("Der Server antwortet mit Status " + r.status);
      if (r.status === 429) break;
    } catch (e) { err = new Error("Keine Verbindung zum Server"); }
  }
  throw err;
}

const geocode = (text, extra) => call("geocode", Object.assign({ text, language: "de" }, extra), false);

async function resolve(d) {
  if (d.to) return d;
  const m = (await geocode(d.q, { type: "STOP", place: BIAS }))[0];
  if (!m) throw new Error("Haltestelle nicht gefunden");
  d.to = m.id; d.name = m.name; save();
  return d;
}

const isTransit = l => !!(l.tripId || l.routeShortName || l.displayName);

async function plan(d) {
  await resolve(d);
  const p = { fromPlace: `${origin.lat},${origin.lon}`, toPlace: d.to, numItineraries: 4, language: "de" };
  if (state.busOnly) p.transitModes = "BUS";
  const j = await call("plan", p, true);
  const list = (j.itineraries || []).filter(i => i.legs.some(isTransit));
  list.forEach(i => i._leg = i.legs.find(isTransit));
  list.sort((a, b) => new Date(a._leg.startTime) - new Date(b._leg.startTime));
  return list.slice(0, 3);
}

// ---------- Darstellung ----------
const fmt = t => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const mins = t => Math.max(0, Math.round((new Date(t) - Date.now()) / 60000));
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const lineName = l => l.displayName || l.routeShortName || "Bus";

function delayNode(l) {
  const dm = Math.round((new Date(l.startTime) - new Date(l.scheduledStartTime || l.startTime)) / 60000);
  if (!l.realTime) return el("span", "meta", "nach Fahrplan");
  if (dm > 0) return el("span", "late", `+${dm} min, Echtzeit`);
  return el("span", "ok", "pünktlich, Echtzeit");
}

function renderCard(d, body) {
  const c = el("section", "card");
  const h = el("div", "head");
  h.append(el("div", "sign", "H"), el("h2", null, d.label || d.name));
  const x = el("button", "x", "✕");
  x.setAttribute("aria-label", `${d.label || d.name} entfernen`);
  x.onclick = () => { state.dests = state.dests.filter(e => e !== d); save(); c.remove(); };
  h.append(x);
  c.append(h, body);
  return c;
}

function bodyFor(its) {
  const b = el("div");
  if (!its.length) { b.append(el("p", "meta", "Keine Verbindung gefunden. Probiere „Nur Bus“ auszuschalten.")); return b; }
  const [first, ...rest] = its;
  const l = first._leg, m = mins(l.startTime);
  const main = el("div", "main");
  const big = el("div", "big", m === 0 ? "jetzt" : String(m));
  if (m > 0) big.append(el("small", null, "min"));
  const info = el("div");
  const line = el("div");
  line.append(el("span", "line", lineName(l)), document.createTextNode(l.headsign ? "Richtung " + l.headsign : ""));
  const t = el("div", "meta", `Abfahrt ${fmt(l.startTime)} an ${l.from && l.from.name || "Haltestelle"} · Ankunft ${fmt(first.endTime)}`);
  info.append(line, t, delayNode(l));
  main.append(big, info);
  b.append(main);
  const walk = first.legs[0] && !isTransit(first.legs[0]) ? Math.round(first.legs[0].duration / 60) : 0;
  const notes = [];
  if (walk) notes.push(`Fußweg ${walk} min bis zur Haltestelle`);
  if (first.transfers) notes.push(`${first.transfers} Umstieg${first.transfers > 1 ? "e" : ""}`);
  if (notes.length) b.append(el("div", "meta", notes.join(" · ")));
  if (rest.length) {
    const more = el("div", "more");
    rest.forEach(i => {
      const r = el("div", "row");
      r.append(el("b", null, fmt(i._leg.startTime)), el("span", null, `${lineName(i._leg)} nach ${i._leg.headsign || "?"}`), el("span", "meta", `an ${fmt(i.endTime)}`));
      more.append(r);
    });
    b.append(more);
  }
  return b;
}

async function refresh() {
  if (!origin) return;
  lastRun = Date.now();
  const list = $("#list");
  const cards = await Promise.all(state.dests.map(async d => {
    try { return renderCard(d, bodyFor(await plan(d))); }
    catch (e) { return renderCard(d, el("p", "err", e.message + ". Tippe auf „Aktualisieren“, um es erneut zu versuchen.")); }
  }));
  list.replaceChildren(...cards);
  if (!state.dests.length) list.append(el("p", "meta", "Noch keine Ziele. Füge unten eine Haltestelle oder Adresse hinzu."));
  $("#status").textContent = `Stand ${fmt(Date.now())} · ${origin.name}`;
}

// ---------- Suchfeld (Ziele und Startpunkt) ----------
function picker(root, placeholder, onPick) {
  const row = el("div", "pick"), inp = el("input"), go = el("button", null, "Suchen");
  inp.placeholder = placeholder; inp.setAttribute("aria-label", placeholder);
  const res = el("ul", "res");
  const run = async () => {
    if (!inp.value.trim()) return;
    res.replaceChildren(el("li", "meta", "Suche …"));
    try {
      const extra = origin ? { place: `${origin.lat},${origin.lon}` } : {};
      const ms = (await geocode(inp.value.trim(), extra)).slice(0, 5);
      res.replaceChildren(...ms.map(m => {
        const li = el("li"), b = el("button", null, m.name + (m.areas && m.areas[0] ? ", " + m.areas[0].name : ""));
        b.onclick = () => { onPick(m); inp.value = ""; res.replaceChildren(); };
        li.append(b); return li;
      }));
      if (!ms.length) res.replaceChildren(el("li", "meta", "Nichts gefunden."));
    } catch (e) { res.replaceChildren(el("li", "err", e.message)); }
  };
  go.onclick = run; inp.onkeydown = e => { if (e.key === "Enter") run(); };
  row.append(inp, go); root.append(row, res);
}

picker($("#dest-picker"), "Haltestelle oder Adresse, z. B. Frankfurt Hbf", m => {
  state.dests.push({ label: m.name, name: m.name, to: m.type === "STOP" ? m.id : `${m.lat},${m.lon}` });
  save(); refresh();
});
picker($("#origin-picker"), "Straße, Ort oder Haltestelle", m => {
  origin = { lat: m.lat, lon: m.lon, name: m.name };
  $("#origin-fallback").hidden = true; refresh();
});

// ---------- Start ----------
function locate() {
  $("#status").textContent = "Standort wird bestimmt …";
  if (!navigator.geolocation) return needManual("Dieses Gerät liefert keinen Standort.");
  navigator.geolocation.getCurrentPosition(
    p => { origin = { lat: p.coords.latitude, lon: p.coords.longitude, name: "Dein Standort" }; refresh(); },
    () => needManual("Der Standort ist nicht erlaubt oder nicht verfügbar."),
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}
function needManual(msg) {
  $("#status").textContent = msg + " Wähle einen Startpunkt.";
  $("#origin-fallback").hidden = false;
}

$("#refresh").onclick = () => origin ? locate() : locate();
$("#bus").onclick = e => {
  state.busOnly = !state.busOnly; save();
  e.currentTarget.setAttribute("aria-pressed", String(state.busOnly));
  refresh();
};
$("#bus").setAttribute("aria-pressed", String(state.busOnly));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && origin && Date.now() - lastRun > 90000) locate();
});
locate();
</script>
</body>
</html>
